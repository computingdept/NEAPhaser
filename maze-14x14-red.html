<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maze 15×15 – Red Player + Shortest Path</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
  <style>html,body{margin:0;background:#111}</style>
</head>
<body>
<script>
const COLS = 15, ROWS = 15;     // path cells
const TILE = 28;                // pixels per tile

new Phaser.Game({
  type: Phaser.AUTO,
  width: 900,
  height: 560,
  backgroundColor: '#111',
  scene: { preload(){}, create, update }
});

let scene, gfxMaze, gfxPath, W, H;
let grid, gw, gh, startGate, endGate, offX, offY;
let player, pg={x:0,y:0}, moving=false, keys;
let btnShowPathToggle = false;  // path overlay on/off

function create(){
  scene = this; W = this.scale.width; H = this.scale.height;

  gfxMaze = this.add.graphics();   // maze & walls
  gfxPath = this.add.graphics();   // dotted shortest path overlay

  this.add.text(12, 10,
    'WASD / Arrows = move   •   Randomise = new maze   •   Show Path = shortest route',
    { fontFamily:'Arial Black', fontSize: 16, color:'#ddd' });

  makeButton(W-250, 24, 120, 34, 'Randomise', rebuild);
  makeButton(W-110, 24, 120, 34, 'Show Path', togglePath);

  this.input.keyboard.on('keydown-R', rebuild);

  keys = this.input.keyboard.addKeys({
    W:'W', A:'A', S:'S', D:'D', UP:'UP', LEFT:'LEFT', DOWN:'DOWN', RIGHT:'RIGHT'
  });

  // Player texture (bright red square with white edge)
  const g = this.add.graphics();
  g.fillStyle(0xff2b2b, 1).fillRoundedRect(0,0,TILE-8,TILE-8,4);
  g.lineStyle(2, 0xffffff, 0.9).strokeRoundedRect(0,0,TILE-8,TILE-8,4);
  g.generateTexture('playerRed', TILE-8, TILE-8);
  g.destroy();

  rebuild();
}

function update(){
  if (moving) return;
  let dx=0, dy=0;
  if (Phaser.Input.Keyboard.JustDown(keys.W) || Phaser.Input.Keyboard.JustDown(keys.UP)) dy=-1;
  else if (Phaser.Input.Keyboard.JustDown(keys.S) || Phaser.Input.Keyboard.JustDown(keys.DOWN)) dy= 1;
  else if (Phaser.Input.Keyboard.JustDown(keys.A) || Phaser.Input.Keyboard.JustDown(keys.LEFT)) dx=-1;
  else if (Phaser.Input.Keyboard.JustDown(keys.D) || Phaser.Input.Keyboard.JustDown(keys.RIGHT)) dx= 1;

  if (dx || dy) tryMove(dx,dy);
}

function tryMove(dx,dy){
  const nx = pg.x + dx, ny = pg.y + dy;
  if (ny>=0 && ny<gh && nx>=0 && nx<gw && grid[ny][nx]===0){
    moving = true;
    pg.x = nx; pg.y = ny;
    const p = toPx(nx, ny);
    scene.tweens.add({
      targets: player, x: p.x, y: p.y, duration: 110, ease:'Sine.easeOut',
      onComplete: ()=>{ moving=false; if (btnShowPathToggle) drawShortestPath(); }
    });
  }
}

/* ------------ Build / Draw ------------ */
function rebuild(){
  const gen = generateMaze(COLS, ROWS); // one top exit, one bottom entry
  grid = gen.grid; startGate = gen.start; endGate = gen.end;
  gw = grid[0].length; gh = grid.length;

  // center on canvas
  offX = Math.floor((W - gw*TILE)/2);
  offY = Math.floor((H - gh*TILE)/2);

  drawMaze();

  // spawn player just inside the bottom gate
  pg = { x: endGate.x, y: gh - 2 };
  const p = toPx(pg.x, pg.y);
  if (!player) player = scene.add.image(p.x, p.y, 'playerRed').setDepth(10);
  else player.setPosition(p.x, p.y);

  // reset path overlay
  btnShowPathToggle = false;
  gfxPath.clear();
}

function drawMaze(){
  gfxMaze.clear();

  // Floor (dark)
  gfxMaze.fillStyle(0x181818, 1);
  gfxMaze.fillRect(offX, offY, gw*TILE, gh*TILE);

  // Walls (white)
  gfxMaze.fillStyle(0xffffff, 1);
  for (let y=0;y<gh;y++){
    for (let x=0;x<gw;x++){
      if (grid[y][x] === 1) {
        gfxMaze.fillRect(offX + x*TILE, offY + y*TILE, TILE, TILE);
      }
    }
  }

  // Corridors (carve them back out as dark floor)
  gfxMaze.fillStyle(0x2b2118, 1);
  for (let y=0;y<gh;y++){
    for (let x=0;x<gw;x++){
      if (grid[y][x] === 0) {
        gfxMaze.fillRect(offX + x*TILE, offY + y*TILE, TILE, TILE);
      }
    }
  }

  // Gates (blue): top exit & bottom entry
  gfxMaze.fillStyle(0x24b2ff, 1);
  gfxMaze.fillRect(offX + startGate.x*TILE, offY + startGate.y*TILE, TILE, TILE); // top
  gfxMaze.fillRect(offX + endGate.x*TILE,   offY + endGate.y*TILE,   TILE, TILE); // bottom

  // Bold border around maze
  gfxMaze.lineStyle(4, 0xffffff, 1);
  gfxMaze.strokeRect(offX, offY, gw*TILE, gh*TILE);
}

/* ------------ Shortest path (BFS) ------------ */
function togglePath(){
  btnShowPathToggle = !btnShowPathToggle;
  if (btnShowPathToggle) drawShortestPath(); else gfxPath.clear();
}

function drawShortestPath(){
  // BFS from player's current tile to the cell just inside the TOP gate (row 1)
  const start = { x: pg.x, y: pg.y };
  const goal  = { x: startGate.x, y: 1 };  // one tile below the top opening

  const q = [start];
  const key = (x,y)=>`${x},${y}`;
  const prev = new Map();
  prev.set(key(start.x,start.y), null);

  while (q.length){
    const cur = q.shift();
    if (cur.x === goal.x && cur.y === goal.y) break;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cur.x + dx, ny = cur.y + dy;
      if (ny>=0 && ny<gh && nx>=0 && nx<gw && grid[ny][nx]===0){
        const k = key(nx,ny);
        if (!prev.has(k)){
          prev.set(k, cur);
          q.push({x:nx,y:ny});
        }
      }
    }
  }

  // Reconstruct
  const path = [];
  let curKey = key(goal.x, goal.y);
  if (!prev.has(curKey)) { gfxPath.clear(); return; } // no path (shouldn't happen in perfect maze)
  while (curKey){
    const [sx,sy] = curKey.split(',').map(Number);
    path.push({x:sx,y:sy});
    const p = prev.get(curKey);
    curKey = p ? key(p.x,p.y) : null;
  }

  // Draw dotted path as small yellow dots at cell centers
  gfxPath.clear();
  gfxPath.fillStyle(0xffe666, 1);
  path.forEach((cell, i) => {
    if (i % 1 === 0) { // every step -> dense dotted line
      const c = toPx(cell.x, cell.y);
      gfxPath.fillCircle(c.x, c.y, 4);
    }
  });
}

/* ------------ Maze generation (recursive backtracker) ------------ */
function generateMaze(cols, rows){
  const GW = 2*cols + 1, GH = 2*rows + 1;                 // full grid with walls
  const g  = Array.from({length:GH},()=>Array(GW).fill(1)); // 1=wall, 0=path

  // Carve
  const visited = Array.from({length:rows},()=>Array(cols).fill(false));
  const startCell = { x: Phaser.Math.Between(0, cols-1), y: Phaser.Math.Between(0, rows-1) };
  const stack=[startCell];
  visited[startCell.y][startCell.x]=true;
  g[startCell.y*2+1][startCell.x*2+1]=0;

  while (stack.length){
    const cur = stack[stack.length-1];
    const nbs=[];
    if(cur.y>0        && !visited[cur.y-1][cur.x]) nbs.push({x:cur.x,y:cur.y-1});
    if(cur.y<rows-1   && !visited[cur.y+1][cur.x]) nbs.push({x:cur.x,y:cur.y+1});
    if(cur.x>0        && !visited[cur.y][cur.x-1]) nbs.push({x:cur.x-1,y:cur.y});
    if(cur.x<cols-1   && !visited[cur.y][cur.x+1]) nbs.push({x:cur.x+1,y:cur.y});

    if(nbs.length){
      const nb = Phaser.Utils.Array.GetRandom(nbs);
      const gx=cur.x*2+1, gy=cur.y*2+1;
      const nx=nb.x*2+1,  ny=nb.y*2+1;
      g[(gy+ny)/2][(gx+nx)/2]=0; // knock wall
      g[ny][nx]=0;               // carve
      visited[nb.y][nb.x]=true;
      stack.push(nb);
    } else stack.pop();
  }

  // Seal edges; open exactly one at TOP and one at BOTTOM
  for (let x=0;x<GW;x++){ g[0][x]=1; g[GH-1][x]=1; }
  for (let y=0;y<GH;y++){ g[y][0]=1; g[y][GW-1]=1; }
  const tops=[], bots=[];
  for (let x=1;x<GW-1;x+=2){ if(g[1][x]===0) tops.push(x); if(g[GH-2][x]===0) bots.push(x); }
  const topX = Phaser.Utils.Array.GetRandom(tops) ?? 1;
  const botX = Phaser.Utils.Array.GetRandom(bots) ?? GW-2;
  g[0][topX]=0;            // exit at top
  g[GH-1][botX]=0;         // entry at bottom

  return { grid: g, start: {x: topX, y: 0}, end: {x: botX, y: GH-1} };
}

/* ------------ Utils & UI ------------ */
function toPx(gx,gy){ return { x: offX + gx*TILE + TILE/2, y: offY + gy*TILE + TILE/2 }; }

function makeButton(x,y,w,h,label,onClick){
  const g=scene.add.graphics({x:x-w/2,y:y-h/2});
  drawBtn(g,w,h,false);
  scene.add.text(x,y,label,{fontFamily:'Arial',fontSize:16,color:'#fff'}).setOrigin(0.5);
  scene.add.zone(x,y,w,h).setInteractive({useHandCursor:true})
    .on('pointerover',()=>drawBtn(g,w,h,true))
    .on('pointerout', ()=>drawBtn(g,w,h,false))
    .on('pointerdown',()=>{ onClick && onClick(); });
}
function drawBtn(g,w,h,hover){
  g.clear();
  g.fillStyle(hover?0x009a70:0x006e51,1);
  g.fillRoundedRect(0,0,w,h,8);
  g.lineStyle(2,0xe6d971,1);
  g.strokeRoundedRect(0,0,w,h,8);
}
</script>
</body>
</html>
