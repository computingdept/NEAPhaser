<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maze 15×15 – Red Player + Shortest Path</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
  <style>html,body{margin:0;background:#111}</style>
</head>
<body>
<script>
const COLS=15, ROWS=15, TILE=28;

new Phaser.Game({
  type: Phaser.AUTO, width: 900, height: 560, backgroundColor: '#111',
  scene: { preload(){}, create, update }
});

let scene, gfxMaze, gfxPath, W, H;
let grid, gw, gh, startGate, endGate, offX, offY;
let player, pg={x:0,y:0}, moving=false, keys;
let showPath=false;

function create(){
  scene=this; W=this.scale.width; H=this.scale.height;
  gfxMaze=this.add.graphics();
  gfxPath=this.add.graphics();

  this.add.text(12,10,'WASD / Arrows to move  •  Randomise  •  Show Path',
    {fontFamily:'Arial Black',fontSize:16,color:'#ddd'});

  makeButton(W-250,24,120,34,'Randomise',rebuild);
  makeButton(W-110,24,120,34,'Show Path',()=>{showPath=!showPath; drawShortestPath();});

  this.input.keyboard.on('keydown-R',rebuild);
  keys=this.input.keyboard.addKeys({W:'W',A:'A',S:'S',D:'D',UP:'UP',LEFT:'LEFT',DOWN:'DOWN',RIGHT:'RIGHT'});
  // Handy: press 0 to re-center player at spawn (if you ever lose him)
  this.input.keyboard.on('keydown-0', ()=>placePlayerAtSpawn());

  rebuild();
}

function update(){
  if(moving) return;
  let dx=0, dy=0;
  if(Phaser.Input.Keyboard.JustDown(keys.W)||Phaser.Input.Keyboard.JustDown(keys.UP)) dy=-1;
  else if(Phaser.Input.Keyboard.JustDown(keys.S)||Phaser.Input.Keyboard.JustDown(keys.DOWN)) dy=1;
  else if(Phaser.Input.Keyboard.JustDown(keys.A)||Phaser.Input.Keyboard.JustDown(keys.LEFT)) dx=-1;
  else if(Phaser.Input.Keyboard.JustDown(keys.D)||Phaser.Input.Keyboard.JustDown(keys.RIGHT)) dx=1;
  if(dx||dy) tryMove(dx,dy);
}

function tryMove(dx,dy){
  const nx=pg.x+dx, ny=pg.y+dy;
  if(ny>=0&&ny<gh&&nx>=0&&nx<gw&&grid[ny][nx]===0){
    moving=true; pg.x=nx; pg.y=ny;
    const p=toPx(nx,ny);
    scene.tweens.add({
      targets:player, x:p.x, y:p.y, duration:110, ease:'Sine.easeOut',
      onComplete:()=>{ moving=false; if(showPath) drawShortestPath(); }
    });
  }
}

function rebuild(){
  const g=generateMaze(COLS,ROWS);
  grid=g.grid; startGate=g.start; endGate=g.end;
  gw=grid[0].length; gh=grid.length;
  offX=Math.floor((W-gw*TILE)/2); offY=Math.floor((H-gh*TILE)/2);

  drawMaze();
  placePlayerAtSpawn();
  showPath=false; gfxPath.clear();
}

function placePlayerAtSpawn(){
  // spawn just inside bottom gate
  pg={x:endGate.x, y:gh-2};
  const p=toPx(pg.x,pg.y);

  if(!player){
    // **Rectangle player** (no texture), giant red with white outline, very high depth
    player = scene.add.rectangle(p.x,p.y, TILE-8, TILE-8, 0xff2b2b)
      .setStrokeStyle(2,0xffffff).setDepth(1000);
  } else {
    player.setPosition(p.x,p.y);
  }
  // Flash so you spot it instantly
  scene.tweens.add({targets:player, alpha:{from:0,to:1}, duration:200});
}

function drawMaze(){
  gfxMaze.clear();
  // Floor
  gfxMaze.fillStyle(0x181818,1);
  gfxMaze.fillRect(offX,offY,gw*TILE,gh*TILE);
  // Walls (white)
  gfxMaze.fillStyle(0xffffff,1);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++) if(grid[y][x]===1)
    gfxMaze.fillRect(offX+x*TILE,offY+y*TILE,TILE,TILE);
  // Corridors (dark)
  gfxMaze.fillStyle(0x2b2118,1);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++) if(grid[y][x]===0)
    gfxMaze.fillRect(offX+x*TILE,offY+y*TILE,TILE,TILE);
  // Gates (blue)
  gfxMaze.fillStyle(0x24b2ff,1);
  gfxMaze.fillRect(offX+startGate.x*TILE, offY+startGate.y*TILE, TILE, TILE);
  gfxMaze.fillRect(offX+endGate.x*TILE,   offY+endGate.y*TILE,   TILE, TILE);
  // Border
  gfxMaze.lineStyle(4,0xffffff,1);
  gfxMaze.strokeRect(offX,offY,gw*TILE,gh*TILE);
}

function drawShortestPath(){
  gfxPath.clear();
  if(!showPath) return;

  const start={x:pg.x,y:pg.y};
  const goal ={x:startGate.x,y:1}; // just inside top gate
  const q=[start], prev=new Map(), key=(x,y)=>`${x},${y}`;
  prev.set(key(start.x,start.y), null);

  while(q.length){
    const cur=q.shift();
    if(cur.x===goal.x && cur.y===goal.y) break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(ny>=0&&ny<gh&&nx>=0&&nx<gw&&grid[ny][nx]===0){
        const k=key(nx,ny);
        if(!prev.has(k)){ prev.set(k,cur); q.push({x:nx,y:ny}); }
      }
    }
  }
  const path=[]; let ck=key(goal.x,goal.y);
  if(!prev.has(ck)) return;
  while(ck){ const [x,y]=ck.split(',').map(Number); path.push({x,y}); const p=prev.get(ck); ck=p?key(p.x,p.y):null; }

  gfxPath.fillStyle(0xffe666,1);
  path.forEach(c=>{ const p=toPx(c.x,c.y); gfxPath.fillCircle(p.x,p.y,4); });
}

/* --------- Maze generation --------- */
function generateMaze(cols,rows){
  const GW=2*cols+1, GH=2*rows+1;
  const g=Array.from({length:GH},()=>Array(GW).fill(1));
  const vis=Array.from({length:rows},()=>Array(cols).fill(false));

  const st={x:Phaser.Math.Between(0,cols-1),y:Phaser.Math.Between(0,rows-1)};
  const stack=[st]; vis[st.y][st.x]=true; g[st.y*2+1][st.x*2+1]=0;

  while(stack.length){
    const c=stack[stack.length-1], nb=[];
    if(c.y>0      && !vis[c.y-1][c.x]) nb.push({x:c.x,y:c.y-1});
    if(c.y<rows-1 && !vis[c.y+1][c.x]) nb.push({x:c.x,y:c.y+1});
    if(c.x>0      && !vis[c.y][c.x-1]) nb.push({x:c.x-1,y:c.y});
    if(c.x<cols-1 && !vis[c.y][c.x+1]) nb.push({x:c.x+1,y:c.y});
    if(nb.length){
      const n=Phaser.Utils.Array.GetRandom(nb);
      g[(c.y*2+1+n.y*2+1)/2][(c.x*2+1+n.x*2+1)/2]=0;
      g[n.y*2+1][n.x*2+1]=0; vis[n.y][n.x]=true; stack.push(n);
    } else stack.pop();
  }

  // seal edges, open exactly one top + one bottom aligned to corridors
  for(let x=0;x<GW;x++){ g[0][x]=1; g[GH-1][x]=1; }
  for(let y=0;y<GH;y++){ g[y][0]=1; g[y][GW-1]=1; }
  const tops=[],bots=[];
  for(let x=1;x<GW-1;x+=2){ if(g[1][x]===0) tops.push(x); if(g[GH-2][x]===0) bots.push(x); }
  const topX=Phaser.Utils.Array.GetRandom(tops)??1;
  const botX=Phaser.Utils.Array.GetRandom(bots)??GW-2;
  g[0][topX]=0; g[GH-1][botX]=0;

  return {grid:g,start:{x:topX,y:0},end:{x:botX,y:GH-1}};
}

/* --------- Utils & UI --------- */
function toPx(gx,gy){ return {x:offX+gx*TILE+TILE/2, y:offY+gy*TILE+TILE/2}; }

function makeButton(x,y,w,h,label,fn){
  const g=scene.add.graphics({x:x-w/2,y:y-h/2});
  drawBtn(g,w,h,false);
  scene.add.text(x,y,label,{fontFamily:'Arial',fontSize:16,color:'#fff'}).setOrigin(0.5);
  scene.add.zone(x,y,w,h).setInteractive({useHandCursor:true})
    .on('pointerover',()=>drawBtn(g,w,h,true))
    .on('pointerout', ()=>drawBtn(g,w,h,false))
    .on('pointerdown',fn);
}
function drawBtn(g,w,h,hover){
  g.clear(); g.fillStyle(hover?0x009a70:0x006e51,1);
  g.fillRoundedRect(0,0,w,h,8);
  g.lineStyle(2,0xe6d971,1); g.strokeRoundedRect(0,0,w,h,8);
}
</script>
</body>
</html>
