<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phaser Matter – Push-Open Door (Hinge)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 900,
  height: 560,
  backgroundColor: '#87CEEB',
  physics: {
    default: 'matter',
    matter: {
      gravity: { y: 1 },   // gravity helps the door swing
      debug: false
    }
  },
  scene: { preload, create, update }
};
new Phaser.Game(config);

let player, cursors, keys;
let door, pushingDoor = false;

function preload(){
  this.load.image('ground', 'https://labs.phaser.io/assets/sprites/platform.png');
  this.load.image('crate',  'https://labs.phaser.io/assets/sprites/crate.png');
}

function create(){
  const M = this.matter;

  // --- Static boundaries ---
  M.add.rectangle(450, 540, 900, 40, { isStatic: true }); // floor
  M.add.rectangle(10, 280, 20, 560,  { isStatic: true }); // walls
  M.add.rectangle(890, 280, 20, 560, { isStatic: true });

  // --- Player (controlled with forces) ---
  player = M.add.circle(140, 460, 22, {
    restitution: 0.0,
    friction: 0.15,
    density: 0.002
  });
  const pSprite = this.add.sprite(0,0,'crate').setTint(0xdef6ff).setScale(0.45);
  M.add.gameObject(pSprite, player);

  // --- Door (vertical plank) ---
  // Make it TALL and THIN (like a wall). Hinge at its LEFT edge.
  const hingeX = 520, hingeY = 460;
  const doorW = 20,  doorH = 160;          // thin vertical plank
  door = M.add.rectangle(hingeX + doorW/2, hingeY, doorW, doorH, {
    restitution: 0,
    friction: 0.5,          // higher friction to transmit push
    frictionAir: 0.002,     // light air resistance
    density: 0.002,
    angle: 0                 // already vertical
  });

  // Pin the door's LEFT EDGE to a world point (true hinge)
  M.add.worldConstraint(door, 0, 1, {
    pointA: { x: hingeX, y: hingeY },
    pointB: { x: -doorW/2, y: 0 } // local offset on the door (left edge center)
  });

  // Add a small stop post so the door doesn't clip the floor when wide open
  M.add.rectangle(hingeX + 120, hingeY + doorH/2 + 4, 10, 10, { isStatic: true });

  // Visual hinge marker
  this.add.circle(hingeX, hingeY, 5, 0x222222);

  // Keyboard control
  cursors = this.input.keyboard.createCursorKeys();
  keys = this.input.keyboard.addKeys({
    A: Phaser.Input.Keyboard.KeyCodes.A,
    D: Phaser.Input.Keyboard.KeyCodes.D,
    W: Phaser.Input.Keyboard.KeyCodes.W,
    SPACE: Phaser.Input.Keyboard.KeyCodes.SPACE
  });

  // Detect when player is actually touching the door
  M.world.on('collisionstart', (evt) => {
    evt.pairs.forEach(pair => {
      const a = pair.bodyA, b = pair.bodyB;
      if ((a === door && b === player) || (b === door && a === player)) pushingDoor = true;
    });
  });
  M.world.on('collisionactive', (evt) => {
    // keep flag true while contact persists
    evt.pairs.forEach(pair => {
      const a = pair.bodyA, b = pair.bodyB;
      if ((a === door && b === player) || (b === door && a === player)) pushingDoor = true;
    });
  });
  M.world.on('collisionend', (evt) => {
    evt.pairs.forEach(pair => {
      const a = pair.bodyA, b = pair.bodyB;
      if ((a === door && b === player) || (b === door && a === player)) pushingDoor = false;
    });
  });

  // Helper text
  this.add.text(18,18,
    'Move: A/← and D/→    Jump: W/↑/Space\nPush into the vertical plank “door” and keep holding → to open further.',
    { fontFamily: 'Arial, Helvetica, sans-serif', fontSize: '16px', color: '#003a2b' }
  );
}

function update(){
  const speed = 0.008; // small force for Matter.js
  const velCap = 6;

  // Move player with forces
  if (cursors.left.isDown || keys.A.isDown) {
    this.matter.body.applyForce(player, player.position, {x:-speed, y:0});
  }
  if (cursors.right.isDown || keys.D.isDown) {
    this.matter.body.applyForce(player, player.position, {x:+speed, y:0});
  }
  const vy = player.velocity.y || 0;
  if ((Phaser.Input.Keyboard.JustDown(cursors.up) || Phaser.Input.Keyboard.JustDown(keys.W) || Phaser.Input.Keyboard.JustDown(keys.SPACE))
      && Math.abs(vy) < 0.01) {
    this.matter.body.setVelocity(player, { x: player.velocity.x, y: -10 });
  }
  // Cap horizontal speed
  if (Math.abs(player.velocity.x) > velCap){
    this.matter.body.setVelocity(player, { x: Phaser.Math.Clamp(player.velocity.x, -velCap, velCap), y: player.velocity.y });
  }

  // --- Progressive opening assist ---
  // If we're in contact with the door AND pushing into it (→ key), add a tiny angular "nudge".
  // This feels like you keep leaning on the door to open it more.
  if (pushingDoor && (cursors.right.isDown || keys.D.isDown)) {
    const current = door.angularVelocity || 0;
    const max = 1.2; // safety cap
    const add = 0.015; // torque-ish boost per frame while pushing
    this.matter.body.setAngularVelocity(door, Phaser.Math.Clamp(current + add, -max, max));
  }
}
</script>
</body>
</html>
