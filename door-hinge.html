<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phaser Matter – Simple WASD + Door in Blue Wall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 900,
  height: 560,
  backgroundColor: '#eef9ff',
  physics: {
    default: 'matter',
    matter: {
      gravity: { y: 1 },   // gravity for the DOOR (player ignores gravity)
      debug: false
    }
  },
  scene: { preload, create, update }
};
new Phaser.Game(config);

let player, keys, door;
let pushingDoor = false;

const SPEED = 3.1;          // player pixels per frame
const OPEN_DIR = +1;        // +1 = opens clockwise
const ANGLE_CLOSED = 0;     // vertical
const ANGLE_OPEN   = Phaser.Math.DegToRad(90);
const PUSH_TORQUE  = 0.012; // door “assist” while pushing

function preload(){}

function create(){
  const M = this.matter;

  // ===== Visual: a long blue wall background with a lighter "hole" for the doorway
  const wallY = 340, wallH = 250, wallW = 760;
  const doorGapW = 80, doorGapH = 150;
  const doorGapX = 520, doorGapY = wallY;

  const g = this.add.graphics();
  // long blue wall slab
  g.fillStyle(0x1f6ad1, 1);
  g.fillRoundedRect((config.width-wallW)/2, wallY - wallH/2, wallW, wallH, 8);
  // cut-out look: draw a lighter rectangle to convey the opening
  g.fillStyle(0xeef9ff, 1);
  g.fillRoundedRect(doorGapX - doorGapW/2, doorGapY - doorGapH/2, doorGapW, doorGapH, 6);

  // ===== Physics wall: three static bodies that match that opening
  // left block
  M.add.rectangle(doorGapX - (doorGapW/2) - (wallW/2 - doorGapW/2)/2,
                  wallY, wallW/2 - doorGapW/2, wallH, { isStatic: true });
  // right block
  M.add.rectangle(doorGapX + (doorGapW/2) + (wallW/2 - doorGapW/2)/2,
                  wallY, wallW/2 - doorGapW/2, wallH, { isStatic: true });
  // lintel/top
  M.add.rectangle(doorGapX, doorGapY - doorGapH/2 - 8, doorGapW, 16, { isStatic: true });

  // Ground (so the door can rest)
  M.add.rectangle(450, 540, 900, 40, { isStatic: true });

  // ===== Door: brown plank hinged on the left jamb
  const doorW = 12;
  const doorH = doorGapH - 10;
  const hingeX = doorGapX - doorGapW/2;
  const hingeY = doorGapY;

  door = M.add.rectangle(hingeX + doorW/2, hingeY, doorW, doorH, {
    friction: 0.7,
    frictionStatic: 0.95,
    frictionAir: 0.015,
    density: 0.003,
    angle: ANGLE_CLOSED
  });

  // Hinge pin (brown door)
  M.add.worldConstraint(door, 0, 1, {
    pointA: { x: hingeX, y: hingeY },
    pointB: { x: -doorW/2, y: 0 }
  });
  const doorVis = this.add.rectangle(0, 0, doorW, doorH, 0x8b5a2b).setStrokeStyle(2, 0x4a3015);
  M.add.gameObject(doorVis, door);
  this.add.circle(hingeX, hingeY, 4, 0x222222); // hinge dot

  // ===== Player: green square that ignores gravity; simple WASD velocity
  player = M.add.rectangle(360, 470, 28, 28, {
    friction: 0.2,
    frictionAir: 0.02,
    density: 0.002
  });
  player.ignoreGravity = true; // <-- lets W move up at start
  const pVis = this.add.rectangle(0, 0, 28, 28, 0x2a9d8f);
  M.add.gameObject(pVis, player);

  keys = this.input.keyboard.addKeys({
    W: Phaser.Input.Keyboard.KeyCodes.W,
    A: Phaser.Input.Keyboard.KeyCodes.A,
    S: Phaser.Input.Keyboard.KeyCodes.S,
    D: Phaser.Input.Keyboard.KeyCodes.D
  });

  // Detect actual physical contact with the door
  M.world.on('collisionstart', (evt) => {
    evt.pairs.forEach(p => {
      if ((p.bodyA === door && p.bodyB === player) || (p.bodyB === door && p.bodyA === player)) pushingDoor = true;
    });
  });
  M.world.on('collisionactive', (evt) => {
    evt.pairs.forEach(p => {
      if ((p.bodyA === door && p.bodyB === player) || (p.bodyB === door && p.bodyA === player)) pushingDoor = true;
    });
  });
  M.world.on('collisionend', (evt) => {
    evt.pairs.forEach(p => {
      if ((p.bodyA === door && p.bodyB === player) || (p.bodyB === door && p.bodyA === player)) pushingDoor = false;
    });
  });

  this.add.text(16,16,
    'WASD to move (no jump). Walk into the brown door inside the blue wall.\nKeep pushing to open it slowly.',
    { fontFamily:'Arial, Helvetica, sans-serif', fontSize:'16px', color:'#003a2b' }
  );
}

function update(){
  const M = this.matter;

  // --- Simple WASD movement (direct velocity), player ignores gravity
  let vx = 0, vy = 0;
  if (keys.A.isDown) vx -= SPEED;
  if (keys.D.isDown) vx += SPEED;
  if (keys.W.isDown) vy -= SPEED;
  if (keys.S.isDown) vy += SPEED;
  M.body.setVelocity(player, { x: vx, y: vy });

  // --- Assist opening only while pushing on the door and pressing the opening direction
  if (pushingDoor && keys.D.isDown && OPEN_DIR === +1) {
    M.body.setAngularVelocity(door, Math.min((door.angularVelocity || 0) + PUSH_TORQUE, 1.2));
  }
  if (pushingDoor && keys.A.isDown && OPEN_DIR === -1) {
    M.body.setAngularVelocity(door, Math.max((door.angularVelocity || 0) - PUSH_TORQUE, -1.2));
  }

  // --- Clamp door angle between closed and open
  const ang = door.angle; // radians
  const minA = ANGLE_CLOSED;
  const maxA = ANGLE_OPEN * OPEN_DIR + ANGLE_CLOSED;

  if (OPEN_DIR > 0) {
    if (ang < minA) { M.body.setAngle(door, minA); M.body.setAngularVelocity(door, 0); }
    if (ang > maxA) { M.body.setAngle(door, maxA); M.body.setAngularVelocity(door, 0); }
  } else {
    if (ang > minA) { M.body.setAngle(door, minA); M.body.setAngularVelocity(door, 0); }
    if (ang < maxA) { M.body.setAngle(door, maxA); M.body.setAngularVelocity(door, 0); }
  }
}
</script>
</body>
</html>
