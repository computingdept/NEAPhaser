<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phaser Matter – Push-Open Door in Wall (WASD)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 900,
  height: 560,
  backgroundColor: '#e7f6ee',
  physics: {
    default: 'matter',
    matter: {
      gravity: { y: 1 },
      debug: false
    }
  },
  scene: { preload, create, update }
};
new Phaser.Game(config);

let player, cursors, keys;
let door, hingeX, hingeY;
let pushingDoor = false;        // true while the player is physically touching the door
const OPEN_DIR = +1;            // +1 = clockwise opening (to the right)
const ANGLE_CLOSED = 0;         // radians, door vertical and closed
const ANGLE_OPEN   = Phaser.Math.DegToRad(85);  // max open angle (~85°)
const PUSH_TORQUE  = 0.012;     // how much we “assist” rotation while pushing
const AIR_DAMP     = 0.015;     // door air resistance to slow it down (heavier feel)

function preload(){
  this.load.image('brick', 'https://labs.phaser.io/assets/sprites/platform.png');
}

function create(){
  const M = this.matter;

  // Floor
  M.add.rectangle(450, 540, 900, 40, { isStatic: true });

  // =======================
  // SOLID WALL WITH DOORWAY
  // =======================
  // We build the wall as three static blocks with a gap (the doorway).
  // Wall params
  const wallY = 360, wallH = 260, wallThick = 40;
  const openingW = 70, openingH = 140; // the doorway size
  const openingX = 500, openingY = wallY; // doorway centre

  // Left wall section
  M.add.rectangle(openingX - (openingW/2) - 150, wallY, 300, wallH, { isStatic: true });
  // Right wall section
  M.add.rectangle(openingX + (openingW/2) + 150, wallY, 300, wallH, { isStatic: true });
  // Lintel (top over the door)
  M.add.rectangle(openingX, openingY - openingH/2 - wallThick/2, openingW, wallThick, { isStatic: true });
  // (Optional) base threshold
  M.add.rectangle(openingX, openingY + openingH/2 + 4, openingW, 8, { isStatic: true });

  // =========
  // THE DOOR
  // =========
  // Door sits in the doorway and is hinged on its LEFT edge.
  const doorW = 12;               // thin plank thickness
  const doorH = openingH - 6;     // slightly smaller than opening height
  hingeX = openingX - openingW/2; // left jamb of the doorway
  hingeY = openingY;

  door = M.add.rectangle(hingeX + doorW/2, hingeY, doorW, doorH, {
    restitution: 0,
    friction: 0.6,           // higher friction so pushes transfer well
    frictionStatic: 0.9,
    frictionAir: AIR_DAMP,
    density: 0.003,
    angle: ANGLE_CLOSED
  });

  // Hinge (pin the door's left edge to the wall)
  M.add.worldConstraint(door, 0, 1, {
    pointA: { x: hingeX, y: hingeY },
    pointB: { x: -doorW/2, y: 0 }
  });

  // Visuals for the door
  const doorG = this.add.rectangle(0, 0, doorW, doorH, 0x6b4f2a).setStrokeStyle(2, 0x3c2a16);
  M.add.gameObject(doorG, door);
  // Hinge marker
  this.add.circle(hingeX, hingeY, 4, 0x222222);

  // =======
  // PLAYER
  // =======
  player = M.add.circle(380, 460, 18, {
    restitution: 0,
    friction: 0.2,
    frictionAir: 0.01,
    density: 0.002
  });
  const pSprite = this.add.rectangle(0, 0, 28, 28, 0x2a9d8f);
  M.add.gameObject(pSprite, player);

  // Input (WASD only as requested)
  keys = this.input.keyboard.addKeys({
    W: Phaser.Input.Keyboard.KeyCodes.W,
    A: Phaser.Input.Keyboard.KeyCodes.A,
    S: Phaser.Input.Keyboard.KeyCodes.S,
    D: Phaser.Input.Keyboard.KeyCodes.D
  });

  // Detect contact with the door
  M.world.on('collisionstart', (evt) => {
    evt.pairs.forEach(pair => {
      const a = pair.bodyA, b = pair.bodyB;
      if ((a === door && b === player) || (b === door && a === player)) pushingDoor = true;
    });
  });
  M.world.on('collisionactive', (evt) => {
    evt.pairs.forEach(pair => {
      const a = pair.bodyA, b = pair.bodyB;
      if ((a === door && b === player) || (b === door && a === player)) pushingDoor = true;
    });
  });
  M.world.on('collisionend', (evt) => {
    evt.pairs.forEach(pair => {
      const a = pair.bodyA, b = pair.bodyB;
      if ((a === door && b === player) || (b === door && a === player)) pushingDoor = false;
    });
  });

  // HUD
  this.add.text(16,16,
    'WASD to move. Walk into the door; keep holding D to push.\nDoor is set in a solid wall and opens slowly on a hinge.',
    { fontFamily:'Arial, Helvetica, sans-serif', fontSize:'16px', color:'#003a2b' }
  );
}

function update(){
  const M = this.matter;
  const runForce = 0.008; // movement force
  const maxV = 6;

  // Movement (WASD)
  if (keys.A.isDown) M.body.applyForce(player, player.position, { x: -runForce, y: 0 });
  if (keys.D.isDown) M.body.applyForce(player, player.position, { x: +runForce, y: 0 });
  if (keys.W.isDown) {
    // jump-ish if on/near floor (simple: if downward speed small and y close to floor)
    if ((player.velocity.y ?? 0) < 0.02) M.body.setVelocity(player, { x: player.velocity.x, y: -9.5 });
  }

  // Cap horizontal speed a bit
  if (Math.abs(player.velocity.x) > maxV) {
    M.body.setVelocity(player, { x: Phaser.Math.Clamp(player.velocity.x, -maxV, maxV), y: player.velocity.y });
  }

  // If we’re touching the door AND pushing towards the opening direction, add a tiny angular boost
  // OPEN_DIR = +1 means we open clockwise (increasing positive angle from vertical)
  if (pushingDoor && keys.D.isDown && OPEN_DIR === +1) {
    const next = (door.angularVelocity || 0) + PUSH_TORQUE;
    M.body.setAngularVelocity(door, Math.min(next, 1.2));
  }
  if (pushingDoor && keys.A.isDown && OPEN_DIR === -1) {
    const next = (door.angularVelocity || 0) - PUSH_TORQUE;
    M.body.setAngularVelocity(door, Math.max(next, -1.2));
  }

  // Clamp the door angle between CLOSED and OPEN so it behaves like a real door
  const ang = door.angle; // in radians
  const minA = ANGLE_CLOSED;
  const maxA = ANGLE_OPEN * OPEN_DIR + ANGLE_CLOSED; // handle direction
  // Normalize to [min,max] depending on OPEN_DIR
  if (OPEN_DIR > 0) {
    if (ang < minA) M.body.setAngle(door, minA), M.body.setAngularVelocity(door, 0);
    if (ang > maxA) M.body.setAngle(door, maxA), M.body.setAngularVelocity(door, 0);
  } else {
    if (ang > minA) M.body.setAngle(door, minA), M.body.setAngularVelocity(door, 0);
    if (ang < maxA) M.body.setAngle(door, maxA), M.body.setAngularVelocity(door, 0);
  }
}
</script>
</body>
</html>
