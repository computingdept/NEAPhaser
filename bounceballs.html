<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phaser – Add-a-Globe Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 900,
  height: 560,
  backgroundColor: '#061526',
  physics: { default: 'arcade', arcade: { gravity:{y:0}, debug:false } },
  scene: { preload, create, update }
};
new Phaser.Game(config);

let globes, label, addBtn, sceneRef;

function preload() {
  // Make a generic globe texture (we’ll tint copies later)
  const g = this.add.graphics();
  g.fillStyle(0xffffff, 1).fillCircle(32, 32, 30);
  g.lineStyle(3, 0xdddddd, 1).strokeCircle(32, 32, 30);
  g.generateTexture('globe', 64, 64);
  g.destroy();
}

function create() {
  const scene = this;
  sceneRef = scene;
  const W = scene.scale.width;
  const H = scene.scale.height;

  // Group for all balls
  globes = scene.physics.add.group();

  // Make a couple at start
  addGlobe(scene, W*0.4, H*0.5);
  addGlobe(scene, W*0.6, H*0.4);

  // Collider between all in the group
  scene.physics.add.collider(globes, globes);

  // UI text
  label = scene.add.text(16, 16, '🪐 Click "+ Add Globe" to add more', {
    fontFamily:'Arial', fontSize:'18px', color:'#bfe9ff'
  });

  // Simple button (HTML-style text button inside Phaser)
  const btnW=130, btnH=36, x=W-90, y=30;
  const g = scene.add.graphics({x:x-btnW/2, y:y-btnH/2});
  drawButton(g, btnW, btnH, false);
  addBtn = scene.add.text(x, y, '+ Add Globe', {
      fontFamily:'Arial', fontSize:'18px', color:'#ffffff'
    }).setOrigin(0.5);

  const hit = scene.add.zone(x, y, btnW, btnH)
    .setInteractive({ useHandCursor:true })
    .on('pointerover', ()=>drawButton(g, btnW, btnH, true))
    .on('pointerout', ()=>drawButton(g, btnW, btnH, false))
    .on('pointerdown', ()=>addGlobe(scene));

  // Click anywhere else to nudge a random globe
  scene.input.on('pointerdown', (p)=>{
    if (hit.getBounds().contains(p.worldX, p.worldY)) return; // ignore button
    const balls = globes.getChildren();
    if(!balls.length) return;
    const target = Phaser.Utils.Array.GetRandom(balls);
    const angle = Phaser.Math.Angle.Between(target.x, target.y, p.worldX, p.worldY);
    const speed = 240;
    target.setVelocity(Math.cos(angle)*speed, Math.sin(angle)*speed);
  });
}

function update() {
  // Nothing needed per frame; physics does the work
}

/* ---------- helpers ---------- */
function drawButton(g,w,h,hover){
  g.clear();
  g.fillStyle(hover?0x009a70:0x006e51,1);
  g.fillRoundedRect(0,0,w,h,8);
  g.lineStyle(2,0xe6d971,1);
  g.strokeRoundedRect(0,0,w,h,8);
}

function addGlobe(scene, x, y){
  const W=scene.scale.width, H=scene.scale.height;
  const gx = x || Phaser.Math.Between(60, W-60);
  const gy = y || Phaser.Math.Between(60, H-60);
  const ball = scene.physics.add.image(gx, gy, 'globe');

  // Give each globe its own random colour tint
  const hue = Phaser.Math.Between(0,360);
  ball.setTint(Phaser.Display.Color.HSVToRGB(hue/360,0.6,1).color);

  ball.body.setCircle(30);
  ball.body.setOffset(2,2);
  ball.setBounce(1,1).setCollideWorldBounds(true);

  const angle = Phaser.Math.FloatBetween(0, Math.PI*2);
  const speed = Phaser.Math.Between(150,250);
  ball.setVelocity(Math.cos(angle)*speed, Math.sin(angle)*speed);

  globes.add(ball);
  label.setText('🪐 Globes: '+globes.getLength());
}
</script>
</body>
</html>
