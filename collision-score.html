<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phaser Collision + Score (8-Way Movement)</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: '#87CEEB',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: { preload, create, update }
};

const game = new Phaser.Game(config);

let player, target, cursors, keys;
let score = 0, scoreText;

function preload() {
  this.load.image('player', 'https://labs.phaser.io/assets/sprites/pangball.png');
  this.load.image('target', 'https://labs.phaser.io/assets/sprites/red_ball.png');
}

function create() {
  // Player & Target
  player = this.physics.add.sprite(200, 300, 'player').setCollideWorldBounds(true);
  target = this.physics.add.staticSprite(600, 300, 'target');

  // Input keys
  cursors = this.input.keyboard.createCursorKeys();
  keys = this.input.keyboard.addKeys({
    W: Phaser.Input.Keyboard.KeyCodes.W,
    A: Phaser.Input.Keyboard.KeyCodes.A,
    S: Phaser.Input.Keyboard.KeyCodes.S,
    D: Phaser.Input.Keyboard.KeyCodes.D
  });

  // Overlap detection
  this.physics.add.overlap(player, target, onHit, null, this);

  // UI
  scoreText = this.add.text(16, 16, 'Score: 0', {
    fontFamily: 'Arial, Helvetica, sans-serif',
    fontSize: '22px',
    color: '#003a2b'
  });

  this.add.text(16, 48, 'Move with Arrow Keys or W/A/S/D (diagonal supported)', {
    fontFamily: 'Arial, Helvetica, sans-serif',
    fontSize: '16px',
    color: '#003a2b'
  });
}

  const speed = 240;
