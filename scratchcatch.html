<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Catch the Apple Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
  </head>
  <body>
    <script>
      const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
          default: 'arcade',
          arcade: { gravity: { y: 0 }, debug: false }
        },
        scene: { preload, create, update }
      };

      const game = new Phaser.Game(config);

      let player, cursors, apples, score = 0, scoreText;

      function preload() {
        // Simple graphics: no external assets needed
      }

      function create() {
        // Player block
        player = this.add.rectangle(400, 550, 50, 50, 0x00ff00);
        this.physics.add.existing(player);
        player.body.setCollideWorldBounds(true);

        // Apple group
        apples = this.physics.add.group();

        // Spawn apples every 1.5 seconds
        this.time.addEvent({
          delay: 1500,
          callback: () => {
            const x = Phaser.Math.Between(50, 750);
            const apple = this.add.rectangle(x, 0, 30, 30, 0xff0000);
            this.physics.add.existing(apple);
            apple.body.setVelocityY(150);
            apples.add(apple);
          },
          loop: true
        });

        // Overlap = "when I catch"
        this.physics.add.overlap(player, apples, catchApple, null, this);

        // WASD keys
        cursors = this.input.keyboard.addKeys({
          up: Phaser.Input.Keyboard.KeyCodes.W,
          down: Phaser.Input.Keyboard.KeyCodes.S,
          left: Phaser.Input.Keyboard.KeyCodes.A,
          right: Phaser.Input.Keyboard.KeyCodes.D
        });

        // Score text
        scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '24px', fill: '#fff' });
      }

      function update() {
        const speed = 300;
        player.body.setVelocity(0);

        if (cursors.left.isDown) player.body.setVelocityX(-speed);
        else if (cursors.right.isDown) player.body.setVelocityX(speed);

        if (cursors.up.isDown) player.body.setVelocityY(-speed);
        else if (cursors.down.isDown) player.body.setVelocityY(speed);
      }

      // Scratch-style "when I catch"
      function catchApple(player, apple) {
        apple.destroy(); // remove apple
        score += 1;
        scoreText.setText('Score: ' + score);
      }
    </script>
  </body>
</html>
